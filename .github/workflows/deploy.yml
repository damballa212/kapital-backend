name: Deploy to Azure Functions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload Sentry source maps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: darks-matter-co
          SENTRY_PROJECT: kapital-backend
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          pnpm exec sentry-cli releases new "$SENTRY_RELEASE" --org "$SENTRY_ORG" --project "$SENTRY_PROJECT"
          pnpm exec sentry-cli sourcemaps upload lib \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            --release "$SENTRY_RELEASE" \
            --strip-common-prefix \
            --validate \
            --wait
          pnpm exec sentry-cli releases finalize "$SENTRY_RELEASE" --org "$SENTRY_ORG"

      - name: Create deployment zip (respecting .funcignore)
        run: |
          zip -r deploy.zip . \
            --exclude ".git*" \
            --exclude ".vscode/*" \
            --exclude "local.settings.json" \
            --exclude "src/*" \
            --exclude "*.ts" \
            --exclude "deploy.zip"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Sentry release metadata
        run: |
          az functionapp config appsettings set \
            --name kapital-api-463222 \
            --resource-group kapital-rg \
            --settings SENTRY_ENVIRONMENT=production SENTRY_RELEASE=${{ github.sha }}

      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --name kapital-api-463222 \
            --resource-group kapital-rg \
            --src deploy.zip \
            --build-remote false
